services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - SEMGREP_BIN=/opt/semgrep-venv/bin/semgrep
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
